version: "3.8"

services:
  postgres:
    image: postgres:15
    restart: always
    container_name: yourapp-db
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT}:3000"
    env_file:
      - ./backend/.env   
    depends_on:
      - postgres       

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT}:5173"
    env_file:
      - ./frontend/.env   
    depends_on:
      - backend 

volumes:
  pgdata:       
